<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Afk token</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>html,body{background:#120a22;height:100%}body{display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<div class="win" id="win">
  <div class="decor blob b1"></div><div class="decor blob b2"></div><div class="decor blob b3"></div>
  <aside class="side">
    <div class="logo">AFK TOKEN</div>
    <nav class="nav" id="nav"></nav>
    <button class="keybox" id="keybox"><span class="muted" id="keysub">Ключ</span><strong id="keytxt">Активировать ключ</strong></button>
  </aside>
  <main class="main">
    <header class="head"><h1 id="title">Функции бота</h1><div class="hright"><span class="status"><span class="dot" id="dot"></span><span id="status">Бот работает</span></span><button class="donate" id="donate" title="Поддержать программу"><span class="dheart">💜</span><span class="dtxt"><b>Поддержать</b><small>проект</small></span></button></div></header>
    <div id="page" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
  </main>
  <div id="overlay"></div>
</div>
<script src="app.js"></script>
</body>
</html>
